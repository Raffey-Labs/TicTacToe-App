<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#10182e"><title>Tic Tac Toe · Built by Raffey</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<div class="orb one"></div><div class="orb two"></div><main class="game" aria-labelledby="title"><div class="top"><span class="brand"><b>×</b> TACTIX</span><button id="sound" aria-label="Toggle sound">♪</button></div><header><p>CLASSIC GAME, FRESH FOCUS</p><h1 id="title">Tic Tac Toe</h1><span id="welcome">Make three in a row before the bot does.</span></header><div class="modes" role="group" aria-label="Game mode"><button class="active" data-mode="bot">VS BOT</button><button data-mode="friend">VS FRIEND</button></div><section class="scores" aria-label="Scoreboard"><div class="x"><small id="playerLabel">YOU</small><strong id="sx">0</strong><i>X</i></div><div><small>DRAWS</small><strong id="st">0</strong><i>–</i></div><div class="o"><small id="opp">BOT</small><strong id="so">0</strong><i>O</i></div></section><p class="status" id="status" aria-live="polite"><span></span>Your turn — play X</p><div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div><div class="actions"><button id="new">New round <b>↻</b></button><button id="names">Edit players</button><button id="reset">Reset scores</button></div><footer>Designed &amp; built with <span>♥</span> by <b>Raffey</b></footer></main>
<section class="name-modal" id="nameModal" aria-labelledby="nameTitle" aria-modal="true" role="dialog"><form id="nameForm" class="name-card"><div class="modal-icon">×</div><p>WELCOME, PLAYER</p><h2 id="nameTitle">Who’s playing?</h2><span>Enter your name to make it yours.</span><label for="playerName">Your name</label><input id="playerName" maxlength="18" autocomplete="name" placeholder="e.g. Alex" required><div id="friendWrap"><label for="friendName">Friend’s name <em>(optional)</em></label><input id="friendName" maxlength="18" placeholder="e.g. Sam"></div><button type="submit">Let’s play <b>→</b></button></form></section><script src="script.js"></script></body></html>
